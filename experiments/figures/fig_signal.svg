<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 214" width="720" height="214" role="img" aria-label="Selection signal: distinct fitness values in one generation" font-family='-apple-system, "Segoe UI", system-ui, sans-serif'><rect width="720" height="214" fill="#ffffff"/><text x="16" y="22" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="700" dominant-baseline="auto">Selection signal: distinct fitness values in one generation</text><text x="16" y="40" font-size="10.5" fill="#898781" text-anchor="start" font-weight="400" dominant-baseline="auto">Population of 60. A value of 1 means every individual ties, so selection is a coin flip.</text><line x1="235" y1="54" x2="235" y2="174" stroke="#e1e0d9" stroke-width="1"/><text x="235" y="190" font-size="9.5" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">0</text><line x1="372" y1="54" x2="372" y2="174" stroke="#e1e0d9" stroke-width="1"/><text x="372" y="190" font-size="9.5" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">10</text><line x1="509" y1="54" x2="509" y2="174" stroke="#e1e0d9" stroke-width="1"/><text x="509" y="190" font-size="9.5" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">20</text><line x1="646" y1="54" x2="646" y2="174" stroke="#e1e0d9" stroke-width="1"/><text x="646" y="190" font-size="9.5" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">30</text><path d="M235 62 H244.7 a4 4 0 0 1 4 4 V84 a4 4 0 0 1 -4 4 H235 Z" fill="#d03b3b"/><text x="225" y="75" font-size="10.5" fill="#0b0b0b" text-anchor="end" font-weight="400" dominant-baseline="middle">as-committed (RouteDiscovery)</text><text x="256.7" y="75" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="600" dominant-baseline="middle">1</text><path d="M235 98 H587.2 a4 4 0 0 1 4 4 V120 a4 4 0 0 1 -4 4 H235 Z" fill="#2a78d6"/><text x="225" y="111" font-size="10.5" fill="#0b0b0b" text-anchor="end" font-weight="400" dominant-baseline="middle">euclidean fallback</text><text x="599.2" y="111" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="600" dominant-baseline="middle">26</text><path d="M235 134 H600.9000000000001 a4 4 0 0 1 4 4 V156 a4 4 0 0 1 -4 4 H235 Z" fill="#2a78d6"/><text x="225" y="147" font-size="10.5" fill="#0b0b0b" text-anchor="end" font-weight="400" dominant-baseline="middle">corrected route scorer</text><text x="612.9000000000001" y="147" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="600" dominant-baseline="middle">27</text><line x1="235" y1="54" x2="235" y2="174" stroke="#c3c2b7" stroke-width="1"/><text x="360" y="206" font-size="10" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">distinct fitness values out of 60</text></svg>