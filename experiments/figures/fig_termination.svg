<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 364" width="720" height="364" role="img" aria-label="How episodes end" font-family='-apple-system, "Segoe UI", system-ui, sans-serif'><rect width="720" height="364" fill="#ffffff"/><text x="16" y="22" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="700" dominant-baseline="auto">How episodes end</text><text x="16" y="40" font-size="10.5" fill="#898781" text-anchor="start" font-weight="400" dominant-baseline="auto">Timeout means the agent was still driving when the frame budget expired - the only good outcome here.</text><rect x="205" y="54" width="10" height="10" rx="2" fill="#d03b3b"/><text x="220" y="59" font-size="9.5" fill="#52514e" text-anchor="start" font-weight="400" dominant-baseline="middle">collision</text><rect x="285" y="54" width="10" height="10" rx="2" fill="#fab219"/><text x="300" y="59" font-size="9.5" fill="#52514e" text-anchor="start" font-weight="400" dominant-baseline="middle">stagnation / reversal</text><rect x="437" y="54" width="10" height="10" rx="2" fill="#0ca30c"/><text x="452" y="59" font-size="9.5" fill="#52514e" text-anchor="start" font-weight="400" dominant-baseline="middle">survived to timeout</text><rect x="205" y="82" width="148.15" height="24" fill="#d03b3b" rx="2"/><text x="279.075" y="94" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="700" dominant-baseline="middle">33%</text><rect x="355.15" y="82" width="302.85" height="24" fill="#fab219" rx="2"/><text x="506.575" y="94" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="700" dominant-baseline="middle">67%</text><text x="195" y="94" font-size="10.5" fill="#0b0b0b" text-anchor="end" font-weight="400" dominant-baseline="middle">NE-A as-committed</text><rect x="205" y="118" width="352.90000000000003" height="24" fill="#d03b3b" rx="2"/><text x="381.45000000000005" y="130" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="700" dominant-baseline="middle">78%</text><r