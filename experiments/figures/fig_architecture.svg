<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="System architecture" font-family='-apple-system, "Segoe UI", system-ui, sans-serif'><rect width="720" height="400" fill="#ffffff"/><text x="16" y="22" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="700" dominant-baseline="auto">End-to-end pipeline</text><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c3c2b7"/></marker></defs><rect x="20" y="46" width="150" height="62" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="1.8"/><text x="95" y="66" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700" dominant-baseline="auto">OpenStreetMap</text><text x="95" y="84" font-size="9.2" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">Overpass extract</text><text x="95" y="97" font-size="9.2" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">nodes + ways</text><rect x="20" y="140" width="150" height="76" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="1.8"/><text x="95" y="160" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700" dominant-baseline="auto">Graph builder</text><text x="95" y="178" font-size="9.2" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">envelopes, polygon</text><text x="95" y="191" font-size="9.2" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">union, road borders</text><rect x="20" y="248" width="150" height="76" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="1.8"/><text x="95" y="268" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700" dominant-baseline="auto">Dijkstra field</text><text x="95" y="286" font-size="9.2" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">route progress</text><text x="95" y="299" font-size="9.2" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">per node</text><rect x="230" y="46" width="160" height="62" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.8"/><text x="310" y="66" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700" dominant-baseline="auto">LiDAR array</text><text x="310" y="84" font-size="9.2" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">5 rays, pi/2 FOV</text><text x="310" y="97" font-size="9.2" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">220 px range</text><rect x="230" y="140" width="160" height="76" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/><text x="310" y="160" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700" dominant-baseline="auto">MLP policy</text><text x="310" y="178" font-size="9.2" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">5-12-10-4,</text><text x="310" y="191" font-size="9.2" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">step activation</text><rect x="230" y="248" width="160" height="76" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.8"/><text x="310" y="268" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700" dominant-baseline="auto">Kinematics</text><text x="310" y="286" font-size="9.2" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">speed, friction,</text><text x="310" y="299" font-size="9.2" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">heading-coupled turn</text><rect x="450" y="46" width="170" height="62" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/><text x="535" y="66" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700" dominant-baseline="auto">Fitness</text><text x="535" y="84" font-size="9.2" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">route progress at</text><text x="535" y="97" font-size="9.2" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">termination</text><rect x="450" y="140" width="170" height="76" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/><text x="535" y="160" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700" dominant-baseline="auto">Genetic algorithm</text><text x="535" y="178" font-size="9.2" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">elitism, tournament,</text><text x="535" y="191" font-size="9.2" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">uniform crossover</text><rect x="450" y="248" width="170" height="76" rx="8" fill="#ffffff" stroke="#eda100" stroke-width="1.8"/><text x="535" y="268" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700" dominant-baseline="auto">Evaluation</text><text x="535" y="286" font-size="9.2" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">held-out poses,</text><text x="535" y="299" font-size="9.2" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">bootstrap + MWU</text><line x1="95" y1="108" x2="95" y2="140" stroke="#c3c2b7" stroke-width="1.6" marker-end="url(#ah)"/><line x1="95" y1="216" x2="95" y2="248" stroke="#c3c2b7" stroke-width="1.6" marker-end="url(#ah)"/><line x1="170" y1="178" x2="230" y2="178" stroke="#c3c2b7" stroke-width="1.6" marker-end="url(#ah)"/><text x="204" y="173" font-size="8.8" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">borders</text><line x1="310" y1="108" x2="310" y2="140" stroke="#c3c2b7" stroke-width="1.6" marker-end="url(#ah)"/><text x="314" y="119" font-size="8.8" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">sensors</text><line x1="310" y1="216" x2="310" y2="248" stroke="#c3c2b7" stroke-width="1.6" marker-end="url(#ah)"/><text x="314" y="227" font-size="8.8" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">4 bits</text><line x1="390" y1="286" x2="450" y2="108" stroke="#c3c2b7" stroke-width="1.6" marker-end="url(#ah)"/><line x1="535" y1="108" x2="535" y2="140" stroke="#c3c2b7" stroke-width="1.6" marker-end="url(#ah)"/><text x="539" y="119" font-size="8.8" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">score</text><line x1="535" y1="216" x2="535" y2="248" stroke="#c3c2b7" stroke-width="1.6" marker-end="url(#ah)"/><text x="539" y="227" font-size="8.8" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">champion</text><line x1="450" y1="178" x2="390" y2="178" stroke="#c3c2b7" stroke-width="1.6" marker-end="url(#ah)"/><text x="424" y="173" font-size="8.8" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">genome</text><text x="20" y="386" font-size="9" fill="#898781" text-anchor="start" font-weight="400" dominant-baseline="auto">Green: data engineering.   Orange: simulation.   Blue: learning.   Yellow: measurement.</text></svg>