<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 358" width="720" height="358" role="img" aria-label="Collision rate on held-out poses" font-family='-apple-system, "Segoe UI", system-ui, sans-serif'><rect width="720" height="358" fill="#ffffff"/><text x="16" y="22" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="700" dominant-baseline="auto">Collision rate on held-out poses</text><text x="16" y="40" font-size="10.5" fill="#898781" text-anchor="start" font-weight="400" dominant-baseline="auto">Share of episodes ending in contact with a road boundary. Lower is better.</text><line x1="205" y1="54" x2="205" y2="318" stroke="#e1e0d9" stroke-width="1"/><text x="205" y="334" font-size="9.5" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">0%</text><line x1="293.2" y1="54" x2="293.2" y2="318" stroke="#e1e0d9" stroke-width="1"/><text x="293.2" y="334" font-size="9.5" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">20%</text><line x1="381.4" y1="54" x2="381.4" y2="318" stroke="#e1e0d9" stroke-width="1"/><text x="381.4" y="334" font-size="9.5" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">40%</text><line x1="469.59999999999997" y1="54" x2="469.59999999999997" y2="318" stroke="#e1e0d9" stroke-width="1"/><text x="469.59999999999997" y="334" font-size="9.5" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">60%</text><line x1="557.8" y1="54" x2="557.8" y2="318" stroke="#e1e0d9" stroke-width="1"/><text x="557.8" y="334" font-size="9.5" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">80%</text><line x1="646" y1="54" x2="646" y2="318" stroke="#e1e0d9" stroke-width="1"/><text x="646" y="334" font-size="9.5" fill="#898781" text-anchor="middle" font-weight="400" dominant-baseline="auto">100%</text><path d="M205 62 H346.53 a4 4 0 0 1 4 4 V84 a4 4 0 0 1 -4 4 H205 Z" fill="#eb6834"/><text x="195" y="75" font-size=